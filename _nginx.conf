#
# nginx ignores the .htaccess files of the shop. This template contains the same rewrite,
# access and cache rules for a shop in the domain root with PHP-FPM.
#
# Setup:
# 1. Copy this file to /etc/nginx/conf.d/modified-shop.conf. It contains map and server
#    blocks and must be included in the http context, together with mime.types.
# 2. Replace the example values: server_name, root, the PHP-FPM socket in both PHP
#    locations and, if the admin directory was renamed, "admin" in the two lines marked
#    "Admin directory".
# 3. Set up HTTPS for production (listen 443 ssl, certificates, redirect from port 80).
# 4. Run "nginx -t" and reload nginx afterwards.
#
# The map blocks may exist only once per nginx instance. With several shops on one server,
# include them once and keep one server block per shop.

# PHP keeps the cache headers of the application; all other files without own rule get max-age=1.
map $uri $modified_cache_control {
    default "max-age=1, public, must-revalidate";
    ~*\.(php[0-9]?|phtml)$ "";
    ~*\.(ico|jpg|jpeg|png|gif|swf|flv|svg|webp|woff|woff2|ttf|otf|eot)$ "max-age=2592000, public, must-revalidate";
    ~*\.(css|js)$ "max-age=604800, private, must-revalidate";
    ~*\.(xml|txt)$ "max-age=604800, public, must-revalidate";
    ~*\.(html|htm)$ "max-age=1, private, must-revalidate";
}

map $uri $modified_svg_csp {
    default "";
    ~*^/(images|cache)/.*\.svg$ "default-src 'none'; style-src 'unsafe-inline'; sandbox";
}

server {
    listen 80;
    server_name shop.example.com;
    root /var/www/modified-shop;
    index index.php index.html;

    server_tokens off;
    autoindex off;
    etag off;
    # Like AddDefaultCharset: only HTML and text responses without own charset.
    charset utf-8;
    charset_types text/plain;
    absolute_redirect off;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    add_header Cache-Control $modified_cache_control;
    add_header Content-Security-Policy $modified_svg_csp always;
    add_header X-Content-Type-Options nosniff always;

    # FastCGI settings for both PHP locations; they inherit these lines.
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_hide_header ETag;

    error_page 400 /error.php?error=400;
    error_page 401 /error.php?error=401;
    error_page 402 /error.php?error=402;
    error_page 403 /error.php?error=403;
    error_page 404 /error.php?error=404;
    error_page 500 /error.php?error=500;

    # Security locations precede PHP and other regular expressions.
    # Paths are case-sensitive like Apache on Linux, so SEO URLs such as /Images/... stay reachable.
    location ~ /\.(?!well-known(?:/|$)) { return 403; }
    location ~* ^/_(?:\.htaccess|nginx\.conf)$ { return 403; }
    location ~ ^/(inc|log|templates_c|download|media/guarantee_labels/archive)(/|$) { return 403; }
    # Admin rules match any first path segment, so a renamed admin directory stays protected.
    location ~ ^/[^/]+/(archives|backups|includes/modules/filemanager/config)(/|$) { return 403; }
    location ~ ^/[^/]+/includes/(?!modules/filemanager/.*\.(?i:php)$)(?!.*\.(?i:css|js|jpg|jpeg|png|gif|webp|ico|svg|html)$) { return 403; }
    location ~ ^/[^/]+/images/(?!.*\.(?i:jpg|jpeg|png|gif|webp|ico|svg)$) { return 403; }
    # Development files must not be exposed when the repository is the document root.
    location ~ ^/(docs|tests|vendor)(/|$) { return 403; }
    location ~* (?:\.(?:bak|sql|ini|log|sh|dist)|\.sql\.(?:gz|bz2|zip)|~)$ { return 403; }
    location ~* ^/(?:composer\.(?:json|lock)|[^/]+\.(?:md|neon)|.*\.code-workspace)$ { return 403; }

    location ~ ^/includes/(?!.*\.(?i:css|js|jpg|jpeg|png|gif|webp|ico|svg|eot|ttf|woff)$) { return 403; }
    location ~ ^/(lang|cache)/(?!.*\.(?i:css|js|jpg|jpeg|png|gif|webp|ico|svg)$) { return 403; }
    location ~ ^/templates/(?!.*\.(?i:css|js|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|otf|eot|xml|webmanifest)$) { return 403; }
    location ~ ^/images/(?!.*\.(?i:css|js|jpg|jpeg|png|gif|webp|ico|svg|woff2|mp4|webm|ogv|pdf)$) { return 403; }
    location ~ ^/media/.*\.(?i:php[0-9]*|phtml|htm|html|xhtml|pl)(/|$) { return 403; }
    location ~ ^/api/it-recht-kanzlei/classes/.*\.(?i:php)(/|$) { return 403; }
    location ~ ^/pub/.*\.(?i:php[0-9]*|phtml|phar)(/|$) { return 403; }

    # Admin directory: replace "admin" here and in @shop_language if it was renamed.
    # It disables the inherited shop rewrites and allows long admin requests.
    location ~ ^/admin(?:/|$) {
        location ~* \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            # Backups, imports and exports can run longer than the default 60 seconds.
            fastcgi_read_timeout 300s;
        }
        try_files $uri $uri/ =404;
    }

    location ~ ^/pub/.*\.(?i:zip|rar|pdf|doc|xls|txt|mov|avi|mpg|mpeg|jpg|jpeg|png|gif|bmp|psd|tif|tiff|wmf|eps|cdr|svg)$ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~* \.php$ {
        try_files $uri @shop_language;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 403; }

    location / {
        rewrite "^/sitemap(.*)\.html$" /shop_content.php?coID=8 last;
        rewrite "^/robots\.txt$" /robots.php last;
        rewrite "^([\/]?)([a-z]{2})\/(.*):::([_0-9]+):([_0-9]+)\.html$" /index.php?cPath=$4&page=$5&language=$2 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*):::([_0-9]+)\.html$" /index.php?cPath=$4&language=$2 last;
        rewrite ":::([_0-9]+):([_0-9]+)\.html$" /index.php?cPath=$1&page=$2 last;
        rewrite ":::([_0-9]+)\.html$" /index.php?cPath=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)::(.+)\.html$" /product_info.php?products_id=$4&language=$2 last;
        rewrite "::(.+)\.html$" /product_info.php?products_id=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*):_:([0-9]+)\.html$" /shop_content.php?coID=$4&language=$2 last;
        rewrite ":_:([0-9]+)\.html$" /shop_content.php?coID=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*):\.:([_0-9]+):([_0-9]+)\.html$" /index.php?manufacturers_id=$4&page=$5&language=$2 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*):\.:([0-9]+)\.html$" /index.php?manufacturers_id=$4&language=$2 last;
        rewrite ":\.:([_0-9]+):([_0-9]+)\.html$" /index.php?manufacturers_id=$1&page=$2 last;
        rewrite ":\.:([0-9]+)\.html$" /index.php?manufacturers_id=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)---([_0-9]+)-([_0-9]+)\.html$" /index.php?cPath=$4&page=$5&language=$2 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)---([_0-9]+)\.html$" /index.php?cPath=$4&language=$2 last;
        rewrite "---([_0-9]+)-([_0-9]+)\.html$" /index.php?cPath=$1&page=$2 last;
        rewrite "---([_0-9]+)\.html$" /index.php?cPath=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)--(.+)\.html$" /product_info.php?products_id=$4&language=$2 last;
        rewrite "--(.+)\.html$" /product_info.php?products_id=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)-_-([0-9]+)\.html$" /shop_content.php?coID=$4&language=$2 last;
        rewrite "-_-([0-9]+)\.html$" /shop_content.php?coID=$1 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)-\.-([_0-9]+)-([_0-9]+)\.html$" /index.php?manufacturers_id=$4&page=$5&language=$2 last;
        rewrite "^([\/]?)([a-z]{2})\/(.*)-\.-([0-9]+)\.html$" /index.php?manufacturers_id=$4&language=$2 last;
        rewrite "-\.-([_0-9]+)-([_0-9]+)\.html$" /index.php?manufacturers_id=$1&page=$2 last;
        rewrite "-\.-([0-9]+)\.html$" /index.php?manufacturers_id=$1 last;

        try_files $uri $uri/ @shop_language;
    }

    # Only missing files/directories receive the language-prefix fallback.
    location @shop_language {
        # Admin directory: replace "admin" here as well if it was renamed.
        if ($uri ~ "^/[a-z]{2}/admin(?:/|$)") { return 404; }
        rewrite "^/([a-z]{2})/(.*)$" /$2?language=$1 last;
        return 404;
    }
}
